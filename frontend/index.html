<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Tanesha Baxi</title>
  <meta name="description"
    content="Tanesha Baxi Fashion House - High-fashion editorial collections, bespoke bridal, and signature couture." />
  <meta name="keywords" content="Tanesha Baxi, Fashion House, Couture, Bridal, Luxury Clothing, Indian Fashion" />
  <meta property="og:title" content="Tanesha Baxi | Fashion House" />
  <meta property="og:description" content="High-fashion editorial collections and signature couture." />
  <meta property="og:image" content="/assets/logo-tanesha.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" type="image/png" href="/assets/logo-tanesha.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

    rel="stylesheet">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
