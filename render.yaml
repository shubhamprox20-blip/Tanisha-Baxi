# Render blueprint for the Tanesha Baxi API.
# Render reads this on "New > Blueprint" and creates the service pre-configured.
# Values marked `sync: false` are NOT stored here — set them in the Render
# dashboard so secrets never enter the repo.

services:
  - type: web
    name: tanesha-baxi-api
    runtime: node
    plan: free
    rootDir: backend

    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and TypeScript lives there — the build fails without it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # Cross-site cookie (API on Render, storefront elsewhere) needs
      # SameSite=None; Secure, which the code derives from this flag.
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true

      # Neon pooled connection string — set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Exact storefront origin, e.g. https://taneshabaxi.com (no trailing slash).
      - key: CLIENT_ORIGIN
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
